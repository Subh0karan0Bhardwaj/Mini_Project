
<!DOCTYPE html>
<html>
<head>
    <title>The Randomizer</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        h1 span {
            color: purple;
        }

        .container {
            background-color: white;
            width: 80%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            background-color: #eeeeee;
            color: black;
            border: 1px solid #cccccc;
            padding: 12px 15px;
            margin: 6px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d8c5ff;
        }

        .generate {
            background-color: purple;
            color: white;
            margin-top: 20px;
        }

        .generate:hover {
            background-color: #650065;
        }

        .result {
            background-color: #f5efff;
            padding: 25px;
            margin-top: 20px;
            border-radius: 8px;
            min-height: 60px;
        }

        #output {
            color: #333;
            font-size: 17px;
        }

    </style>
</head>

<body>

    <h1>The <span>Randomizer</span></h1>

    <p>Feeling bored? Let us find something random for you!</p>

    <div class="container">

        <h3>Choose a category</h3>

        <button onclick="generateRandom('facts')">Random Facts</button>

        <button onclick="generateRandom('challenges')">Challenges</button>

        <button onclick="generateRandom('activities')">Activities</button>
    
        <button onclick="generateRandom('motivation')">Motivation</button>

        <div class="result">
            <h3>Your Result</h3>
            <p id="output">Select a category to get started!</p>
        </div>

    </div>

    <script>

        let facts = [
            "Octopuses have three hearts.",
            "Sharks existed before trees.",
            "Butterflies taste using their feet.",
            "The Moon is slowly moving away from Earth.",
            "A group of flamingos is called a flamboyance."
        ];

        let challenges = [
            "Learn one new word today.",
            "Draw something with your non-dominant hand.",
            "Try solving a new puzzle.",
            "Write a short story in five sentences.",
            "Learn something new for 10 minutes."
        ];

        let activities = [
            "Listen to a song you have never heard before.",
            "Draw your dream house.",
            "Take a photo of something interesting.",
            "Create your own fictional character.",
            "Make a playlist of your favourite songs."
        ];

        let motivation = [
            "Small progress is still progress.",
            "Every expert was once a beginner.",
            "Keep learning and keep growing.",
            "Believe in yourself.",
            "Great things take time. Be patient."
        ];

        let selectedCategory = "";

        function selectCategory(category) {

            selectedCategory = category;

            document.getElementById("output").innerText =
                "Now click the Generate Something button!";

        }

    function generateRandom(category) {

    let items;

    if (category == "facts") {
        items = facts;
    }
    else if (category == "challenges") {
        items = challenges;
    }
    else if (category == "activities") {
        items = activities;
    }
    else if (category == "motivation") {
        items = motivation;
    }

    let randomNumber = Math.floor(Math.random() * items.length);

    let result = items[randomNumber];

    document.getElementById("output").innerText = result;

}

    </script>

</body>
</html>
