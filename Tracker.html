<!DOCTYPE html>
<html>
<head>
    <title>The Randomizer</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        span {
            color: purple;
        }

        .container {
            background-color: white;
            width: 80%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            background-color: #eeeeee;
            border: 1px solid #ccc;
            padding: 12px 15px;
            margin: 6px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d8c5ff;
        }

        .result {
            background-color: #f5efff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        #output {
            font-size: 17px;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>The <span>Randomizer</span></h1>

    <p>Feeling bored? Let us find something random for you!</p>

    <div class="container">

        <h3>Choose a category</h3>

        <button onclick="generate('facts')">Random Facts</button>
        <button onclick="generate('challenges')">Challenges</button>
        <button onclick="generate('activities')">Activities</button>
        <button onclick="generate('motivation')">Motivation</button>

        <div class="result">
            <h3>Your Result</h3>
            <p id="output">Select a category to get started!</p>
        </div>

    </div>

    <script>

        let facts = [
            "Octopuses have three hearts.",
            "Sharks existed before trees.",
            "Butterflies taste using their feet.",
            "The Moon is slowly moving away from Earth.",
            "A group of flamingos is called a flamboyance."
        ];

        let challenges = [
            "Learn one new word today.",
            "Draw something with your non-dominant hand.",
            "Try solving a new puzzle.",
            "Write a short story in five sentences.",
            "Learn something new for 10 minutes."
        ];

        let activities = [
            "Listen to a song you have never heard before.",
            "Draw your dream house.",
            "Take a photo of something interesting.",
            "Create your own fictional character.",
            "Make a playlist of your favourite songs."
        ];

        let motivation = [
            "Small progress is still progress.",
            "Every expert was once a beginner.",
            "Keep learning and keep growing.",
            "Believe in yourself.",
            "Great things take time. Be patient."
        ];

        function generate(category) {

            let list;

            if (category == "facts") {
                list = facts;
            }
            else if (category == "challenges") {
                list = challenges;
            }
            else if (category == "activities") {
                list = activities;
            }
            else if (category == "motivation") {
                list = motivation;
            }

            let number = Math.floor(Math.random() * list.length);

            document.getElementById("output").innerText = list[number];

        }

    </script>

</body>
</html>
